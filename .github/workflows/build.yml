name: strongR-frida-build

on:
  workflow_dispatch:

jobs:
  android_build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Android NDK r25b manually
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip android-ndk-r25b-linux.zip
        mv android-ndk-r25b $HOME/android-ndk-r25b

    - name: Setup environment
      run: |
        echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r25b" >> $GITHUB_ENV
        echo "ANDROID_NDK=$HOME/android-ndk-r25b" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-ndk-r25b" >> $GITHUB_ENV
        echo "$HOME/android-ndk-r25b" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          flex \
          bison \
          python3-pip \
          libc6-dev-i386 \
          g++-multilib
        python3 -m pip install lief

    - name: Clone Frida
      run: |
        git clone --recurse-submodules https://github.com/frida/frida

    - name: Build Android arm64
      run: |
        echo "NDK ROOT: $ANDROID_NDK_ROOT"
        ls $ANDROID_NDK_ROOT

        cd frida
        ./configure --host=android-arm64
        make -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frida-server-android-arm64
        path: frida/build/subprojects/frida-core/server/frida-server
